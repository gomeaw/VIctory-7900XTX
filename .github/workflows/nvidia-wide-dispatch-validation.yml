name: NVIDIA wide dispatch validation
on:
  push:
    branches: [validation/nvidia-wide-dispatch]
permissions:
  contents: read
jobs:
  dispatch:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Verify group IDs from translated shader
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $output = cargo test --locked -p victory-shader --lib the_group_id_in_x_starts_at_the_host_base -- --nocapture 2>&1 | Out-String
          $status = $LASTEXITCODE
          Write-Host $output
          if ($status -ne 0 -or $output -notmatch 'checked translated group IDs at bases 0 and 65,535 on WARP') {
            throw 'The translated shader must run on WARP'
          }
      - name: Verify original and split indirect execution
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $output = cargo test --locked -p victory-gpu --lib warp_split_runs_every_group_of_a_wide_dispatch_once -- --nocapture 2>&1 | Out-String
          $status = $LASTEXITCODE
          Write-Host $output
          if ($status -ne 0 -or $output -notmatch 'checked all eight wide dispatch cases on WARP') {
            throw 'The split dispatch fixture must run on WARP'
          }
      - name: Asset policy
        run: cargo xtask policy
