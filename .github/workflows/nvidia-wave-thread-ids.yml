name: NVIDIA compute thread IDs
on:
  push:
    branches: [validation/nvidia-wave32-thread-ids]
permissions:
  contents: read
jobs:
  lane-order:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Select the SDK DXIL validator
        run: |
          $kits = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Directory
          $dxil = $kits | Sort-Object Name -Descending | ForEach-Object {
            Join-Path $_.FullName 'x64\dxil.dll'
          } | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $dxil) { throw 'No SDK DXIL validator found' }
          "VICTORY_DXIL=$dxil" >> $env:GITHUB_ENV
      - name: Shader tests with DXIL and WARP
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $log = cargo test --locked -p victory-shader --lib -- --nocapture 2>&1 | Tee-Object -Variable output
          $status = $LASTEXITCODE
          $log | Write-Host
          if ($status -ne 0) { exit $status }
          if (($output | Out-String) -notmatch 'DXIL validator accepted all wave ticket cases') { throw 'DXIL validation was skipped' }
          if (($output | Out-String) -notmatch 'all 3 ticket dispatches wrote each ID once') { throw 'WARP dispatches were skipped' }
      - name: Wave ticket with optimization enabled
        env:
          VICTORY_SHADER_OPT: '127'
        run: cargo test --locked -p victory-shader --lib lane_order_tests -- --nocapture
      - name: Asset policy
        run: cargo xtask policy
