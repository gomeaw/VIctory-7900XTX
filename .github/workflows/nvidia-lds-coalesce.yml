name: Wave32 LDS read barriers
on:
  push:
    branches: [validation/nvidia-lds-coalesce]
permissions:
  contents: read
jobs:
  shaders:
    runs-on: windows-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Select the SDK DXIL validator
        run: |
          $kits = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Directory
          $dxil = $kits | Sort-Object Name -Descending | ForEach-Object {
            Join-Path $_.FullName 'x64\dxil.dll'
          } | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $dxil) { throw 'No SDK DXIL validator found' }
          "VICTORY_DXIL=$dxil" >> $env:GITHUB_ENV
      - name: Count the barriers on the target branch
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $path = 'crates/victory-shader/src/emit/lower.rs'
          git restore --source=39031cb400fb8f05aec27d164801fbc74166ca2d -- $path
          if ($LASTEXITCODE -ne 0) { throw 'Could not restore the baseline emitter' }
          try {
            $output = cargo test --locked -p victory-shader --lib wave32_lds_read_runs_share_a_barrier -- --nocapture 2>&1
            $status = $LASTEXITCODE
            $output | Write-Host
            $log = $output | Out-String
            if ($status -eq 0 -or $log -notmatch 'wave32 LDS barriers' -or $log -notmatch 'left: 7') {
              throw 'The baseline did not emit seven barriers in the fixture'
            }
          } finally {
            git restore --source=$env:GITHUB_SHA -- $path
            if ($LASTEXITCODE -ne 0) { throw 'Could not restore the patched emitter' }
          }
      - name: Validate Wave32 and check Wave64 kept its explicit barrier
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $output = cargo test --locked -p victory-shader --lib -- --nocapture 2>&1
          $status = $LASTEXITCODE
          $output | Write-Host
          if ($status -ne 0) { exit $status }
          $log = $output | Out-String
          if ($log -notmatch 'wave32 LDS barriers: 4; wave64 LDS barriers: 1' -or $log -notmatch 'DXIL validator accepted the LDS read runs') {
            throw 'Expected barrier counts or DXIL validation were missing'
          }
      - name: Check optimized lowering
        env:
          VICTORY_SHADER_OPT: '127'
        run: cargo test --locked -p victory-shader --lib wave32_lds_read_runs_share_a_barrier -- --nocapture
      - name: Keep the fence-only diagnostic mode intact
        env:
          VICTORY_GROUP_SYNC: '0'
        run: cargo test --locked -p victory-shader --lib wave32_lds_read_runs_share_a_barrier -- --nocapture
      - run: cargo xtask policy
