name: NVIDIA dynamic descriptor ranges
on:
  push:
    branches: [validation/nvidia-dynamic-ranges]
permissions:
  contents: read
jobs:
  dynamic-ranges:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      VICTORY_D3D12_WARP: '1'
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Check fragmented ranges and real D3D12 descriptor heaps
        run: |
          cargo test --locked -p victory-gpu --features diagnostics --lib descriptor::host:: -- --test-threads=1 --nocapture
      - name: Asset policy
        run: cargo xtask policy
