name: NVIDIA shader validation
on:
  push:
    branches: [validation/nvidia-wave32-lds-flags]
permissions:
  contents: read
jobs:
  wave32:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Original lowering refuses the split wave flag
        run: |
          git restore --source=0a43566 -- crates/victory-shader/src/emit/lower.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $PSNativeCommandUseErrorActionPreference = $false
          $output = cargo test --locked -p victory-shader --lib a_branch_that_only_raises_an_lds_flag_runs_in_waves_of_32 -- --nocapture 2>&1 | Out-String
          $status = $LASTEXITCODE
          Write-Host $output
          if ($status -eq 0 -or $output -notmatch 'left: Some\(64\)' -or $output -notmatch 'right: Some\(32\)') {
            throw 'Expected the original lowering to retain wave64'
          }
          exit 0
      - name: Shader tests with the split wave lowering
        run: |
          git restore --source=$env:GITHUB_SHA -- crates/victory-shader/src/emit/lower.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p victory-shader --lib -- --nocapture
      - name: Asset policy
        run: cargo xtask policy
